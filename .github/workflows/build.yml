name: Auto Rename Package and Build APK
on:
  workflow_dispatch: # Allows you to run this with 1-click whenever you want

jobs:
  rename-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Automated Package Renamer
        run: |
          OLD_PKG="com.kushagra.bitchord"
          NEW_PKG="com.amazon.mp3" # 👈 TYPE YOUR NEW PACKAGE NAME HERE
          NEW_APP_NAME="BitChord"     # 👈 TYPE YOUR NEW APP NAME HERE

          
      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build Production APK
        run: ./gradlew assembleRelease

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Custom-BitChord-APK
          path: app/build/outputs/apk/release/*.apk
