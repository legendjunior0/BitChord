name: Auto Rename Package and Build APK
on:
  workflow_dispatch:

jobs:
  rename-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      # Set Java to 17 (matches your build.gradle.kts Java 17 configuration)
      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Automated Package Renamer
        run: |
          OLD_PKG="com.music.bitchord"
          NEW_PKG="com.amazon.mp3"
          NEW_APP_NAME="BitChord"
          
          echo "Updating Android Application ID..."
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "AndroidManifest.xml" \) -exec sed -i "s/$OLD_PKG/$NEW_PKG/g" {} +
          
          echo "Updating App Name..."
          find . -type f -name "strings.xml" -exec sed -i "s/>BitChord</>$NEW_APP_NAME</g" {} +

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Remove any existing keystore file so Gradle triggers the unsigned/debug fallback
      - name: Delete Original Keystore
        run: rm -f bitchord-release.jks app/bitchord-release.jks keystore.properties

      # Build the Production Debug APK directly
      - name: Build Custom APK
        run: ./gradlew assembleProdDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Custom-BitChord-APK
          path: app/build/outputs/apk/**/*.apk
