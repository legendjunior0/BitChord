name: Auto Rename Package and Build APK
on:
  workflow_dispatch:

jobs:
  rename-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Java Environment
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Automated Package Renamer
        run: |
          OLD_PKG="com.music.bitchord"
          NEW_PKG="com.amazon.mp3"
          NEW_APP_NAME="BitChord"
          
          echo "Updating Android Application ID..."
          find . -type f \( -name "build.gradle" -o -name "build.gradle.kts" -o -name "AndroidManifest.xml" \) -exec sed -i "s/$OLD_PKG/$NEW_PKG/g" {} +
          
          echo "Updating App Name..."
          find . -type f -name "strings.xml" -exec sed -i "s/>BitChord</>$NEW_APP_NAME</g" {} +

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      # Force delete all upstream keystores to ensure no stray signing triggers
      - name: Wipe Upstream Keystores
        run: |
          find . -name "*.jks" -delete
          find . -name "keystore.properties" -delete

      # Fix executable permissions for the Gradle wrapper
      - name: Make Gradle Wrapper Executable
        run: chmod +x gradlew

      # Clean the workspace and explicitly build only the debug flavor
      - name: Build Custom APK
        run: ./gradlew clean assembleProdDebug

      - name: Upload Finished APK
        uses: actions/upload-artifact@v4
        with:
          name: Custom-BitChord-APK
          path: app/build/outputs/apk/prod/debug/*.apk
